<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header>
            <h1>📝 My To-Do List</h1>
            <p class="date" id="currentDate"></p>
        </header>

        <!-- Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="What do you need to do today?"
                autocomplete="off"
            >
            <button id="addBtn" onclick="addTask()">Add Task</button>
        </div>

        <!-- Stats Section -->
        <div class="stats">
            <span id="totalTasks">Total: 0</span>
            <span id="completedTasks">Completed: 0</span>
        </div>

        <!-- Task List Section -->
        <ul id="taskList" class="task-list">
            <!-- Tasks will be added here dynamically -->
        </ul>

        <!-- Empty State (shown when no tasks) -->
        <div id="emptyState" class="empty-state">
            <p>No tasks yet! Add one above ☝️</p>
        </div>

        <!-- Clear All Button -->
        <button id="clearBtn" class="clear-btn" onclick="clearAllTasks()">
            Clear All Tasks
        </button>

        <!-- Footer -->
        <footer>
            <p>Built with HTML, CSS & JavaScript</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
